<!DOCTYPE html>

<style>
  body { margin:0; padding:24px; background:#F2F2F2; font-family:"PingFang SC",-apple-system,sans-serif; color:#111; }

  p { margin:0 0 20px; font-size:13px; color:#666; }
  .row { display:flex; gap:24px; overflow-x:auto; padding-bottom:16px; align-items:flex-start; }

  a { color:#999; }
  .legend span { display:inline-block; margin-right:16px; }
