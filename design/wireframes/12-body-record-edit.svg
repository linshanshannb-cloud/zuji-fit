  <text x="16" y="518" font-size="12" fill="#E5484D" font-weight="400" text-anchor="start">请填写体重</text>
  <text x="16" y="544" font-size="9" fill="#2F80ED" font-weight="400" text-anchor="start">选到已有记录的日期 → 自动载入该日记录转为编辑（每天最多 1 条）</text>
