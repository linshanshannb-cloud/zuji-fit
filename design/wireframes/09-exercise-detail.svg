  <text x="16" y="550" font-size="15" fill="#FF5A1F" font-weight="700" text-anchor="start">01</text>
  <text x="48" y="550" font-size="14" fill="#111111" font-weight="400" text-anchor="start">平躺在长凳上，双脚平放在地上，背部紧贴长凳。</text>
  <text x="16" y="580" font-size="15" fill="#FF5A1F" font-weight="700" text-anchor="start">02</text>
  <text x="48" y="580" font-size="14" fill="#111111" font-weight="400" text-anchor="start">正手握住杠铃，握距略宽于肩宽。</text>
  <text x="16" y="610" font-size="15" fill="#FF5A1F" font-weight="700" text-anchor="start">03</text>
  <text x="48" y="610" font-size="14" fill="#111111" font-weight="400" text-anchor="start">将杠铃从架上提起，置于胸部正上方。</text>
  <text x="16" y="640" font-size="15" fill="#FF5A1F" font-weight="700" text-anchor="start">04</text>
  <text x="48" y="640" font-size="14" fill="#111111" font-weight="400" text-anchor="start">将杠铃慢慢降低到胸部，保持肘部内收。</text>
  <text x="48" y="664" font-size="11" fill="#8C8C8C" font-weight="400" text-anchor="start">… 共 7 步；缺中文时显示英文 +“暂无中文”标签</text>
