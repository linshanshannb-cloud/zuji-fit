<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="PingFang SC, -apple-system, 'Helvetica Neue', sans-serif">
  <title>13 空状态 / 失败状态 / 删除确认</title>
  <rect x="0" y="0" width="375" height="812" fill="#FFFFFF"/>
  <rect x="0" y="0" width="375" height="44" rx="0" fill="#FFFFFF"/>
  <text x="28" y="30" font-size="14" fill="#111111" font-weight="600" text-anchor="start">9:41</text>
  <rect x="330" y="20" width="22" height="11" rx="3" fill="none" stroke="#111111" stroke-width="1"/>
  <rect x="332" y="22" width="15" height="7" rx="1.5" fill="#111111"/>
  <text x="16" y="72" font-size="24" fill="#111111" font-weight="700" text-anchor="start">状态合集</text>
  <rect x="16" y="96" width="343" height="120" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="28" y="116" font-size="11" fill="#2F80ED" font-weight="400" text-anchor="start">A 日历·当月无训练</text>
  <text x="187.5" y="150" font-size="15" fill="#666666" font-weight="400" text-anchor="middle">这个月还没有训练</text>
  <rect x="127.5" y="166" width="120" height="36" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1"/>
  <text x="187.5" y="189.5" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">开始训练</text>
  <rect x="16" y="228" width="343" height="110" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="28" y="248" font-size="11" fill="#2F80ED" font-weight="400" text-anchor="start">B 动作库·无搜索结果</text>
  <text x="187.5" y="280" font-size="15" fill="#666666" font-weight="400" text-anchor="middle">没有找到“飞鸟”</text>
  <text x="187.5" y="302" font-size="12" fill="#8C8C8C" font-weight="400" text-anchor="middle">试试其他关键词，或清除筛选</text>
  <text x="187.5" y="324" font-size="13" fill="#111111" font-weight="600" text-anchor="middle">清除筛选</text>
  <rect x="16" y="350" width="343" height="130" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="28" y="370" font-size="11" fill="#2F80ED" font-weight="400" text-anchor="start">C 身体数据·无记录 / 不足 2 个点</text>
  <path d="M120 430 L160 410 L200 420 L250 395" stroke="#E5E5E5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="187.5" y="452" font-size="14" fill="#666666" font-weight="400" text-anchor="middle">记录第一次体重，开始看趋势</text>
  <text x="187.5" y="470" font-size="11" fill="#8C8C8C" font-weight="400" text-anchor="middle">仅 1 条时只显示该点数值，不画线</text>
  <rect x="16" y="492" width="343" height="96" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="28" y="512" font-size="11" fill="#2F80ED" font-weight="400" text-anchor="start">D 失败状态</text>
  <rect x="40" y="516" width="295" height="40" rx="8" fill="#111111"/>
  <text x="56" y="541" font-size="13" fill="#FFFFFF" font-weight="400" text-anchor="start">保存失败：存储空间不足</text>
  <text x="319" y="541" font-size="13" fill="#FF5A1F" font-weight="600" text-anchor="end">重试</text>
  <text x="187.5" y="572" font-size="11" fill="#8C8C8C" font-weight="400" text-anchor="middle">读取失败：整页“数据加载失败 · 重新加载”</text>
  <text x="187.5" y="586" font-size="10" fill="#8C8C8C" font-weight="400" text-anchor="middle">只读模式：顶部常驻条“数据版本较新，请更新小程序”，写入入口置灰</text>
  <rect x="16" y="600" width="343" height="190" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="28" y="620" font-size="11" fill="#2F80ED" font-weight="400" text-anchor="start">E 删除确认（wx.showModal）</text>
  <rect x="57.5" y="628" width="260" height="146" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="187.5" y="662" font-size="17" fill="#111111" font-weight="600" text-anchor="middle">删除这次训练？</text>
  <text x="187.5" y="688" font-size="11" fill="#666666" font-weight="400" text-anchor="middle">10月15日 · 5 个动作 18 组，删除后无法恢复</text>
  <line x1="57.5" y1="722" x2="317.5" y2="722" stroke="#E5E5E5" stroke-width="0.5"/>
  <line x1="187.5" y1="722" x2="187.5" y2="774" stroke="#E5E5E5" stroke-width="0.5"/>
  <text x="122.5" y="754" font-size="16" fill="#111111" font-weight="400" text-anchor="middle">取消</text>
  <text x="252.5" y="754" font-size="16" fill="#E5484D" font-weight="600" text-anchor="middle">删除</text>
  <rect x="120.5" y="799" width="134" height="5" rx="2.5" fill="#111111"/>
  <rect x="0.5" y="0.5" width="374" height="811" fill="none" stroke="#D0D0D0" stroke-width="1"/>
</svg>
